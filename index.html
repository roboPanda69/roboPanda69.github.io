<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Prashun Pandey - Maker, Robotics & Space Tech Builder" />
  <title>Prashun Pandey | Core System</title>

  <!-- Futuristic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-void: #020305;
      --card-base: #0a0d14;
      --gold-trace: #eab308;
      --cyan-hud: #00f0ff;
      --text-main: #f8fafc;
      --text-dim: #8b9bb4;
      --panel-border: rgba(0, 240, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-void);
      /* Subtle schematic grid background */
      background-image: 
        radial-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px),
        radial-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
      perspective: 1200px;
    }

    /* Starfield/Constellation Canvas */
    #space-canvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1; pointer-events: none; opacity: 0.6;
    }

    .card-wrapper {
      width: 100%;
      max-width: 480px;
      transform-style: preserve-3d;
      animation: systemDropIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes systemDropIn {
      0% { opacity: 0; transform: translateY(-30px) scale(0.95) rotateX(10deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
    }

    /* Hardware Data Pad Look */
    .hardware-panel {
      position: relative;
      background: var(--card-base);
      padding: 40px 30px 30px;
      /* Chamfered corners like a microchip / satellite panel */
      clip-path: polygon(
        25px 0, 100% 0, 
        100% calc(100% - 25px), calc(100% - 25px) 100%, 
        0 100%, 0 25px
      );
      border: 1px solid transparent;
    }

    /* Golden Circuit traces via pseudo-element */
    .hardware-panel::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(135deg, var(--gold-trace) 20px, transparent 20px),
        linear-gradient(-45deg, var(--cyan-hud) 20px, transparent 20px);
      background-position: top left, bottom right;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      z-index: -1;
      padding: 2px;
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      clip-path: inherit;
    }

    /* Top Left Status LED */
    .status-led {
      position: absolute;
      top: 20px; right: 30px;
      display: flex; align-items: center; gap: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 10px; color: var(--gold-trace);
      letter-spacing: 1px;
    }

    .led-dot {
      width: 8px; height: 8px;
      background-color: var(--gold-trace);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold-trace);
      animation: blink-led 2s infinite;
    }

    @keyframes blink-led {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Core Avatar */
    .avatar-core {
      width: 80px; height: 80px;
      margin: 0 auto 20px;
      background: radial-gradient(circle at center, #111, #000);
      border: 2px solid var(--cyan-hud);
      transform: rotate(45deg); /* Diamond shape */
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
    }

    .avatar-core:hover {
      box-shadow: 0 0 30px var(--cyan-hud), inset 0 0 20px var(--cyan-hud);
    }

    .avatar-text {
      transform: rotate(-45deg); /* Un-rotate text */
      font-family: 'Orbitron', sans-serif;
      font-size: 28px; font-weight: 900;
      color: var(--gold-trace);
      text-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
    }

    h1 {
      text-align: center; font-family: 'Orbitron', sans-serif;
      font-size: 26px; font-weight: 800; letter-spacing: 2px;
      color: #fff; text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center; color: var(--text-dim);
      font-size: 16px; font-weight: 500; letter-spacing: 0.5px;
      line-height: 1.5; margin-bottom: 24px;
    }

    .tagline span { color: var(--cyan-hud); font-weight: 700; }

    /* Boot Sequence Terminal */
    .telemetry-box {
      background: #05080f;
      border: 1px solid var(--panel-border);
      padding: 14px 16px; margin-bottom: 24px;
      border-left: 4px solid var(--gold-trace);
      font-family: 'Fira Code', monospace;
      font-size: 12px; color: var(--cyan-hud);
      position: relative; overflow: hidden;
      min-height: 80px;
    }

    /* Scanline effect */
    .telemetry-box::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.4) 51%);
      background-size: 100% 4px; pointer-events: none;
    }

    .typing-text { line-height: 1.6; }
    .cursor { display: inline-block; width: 8px; height: 14px; background: var(--cyan-hud); vertical-align: middle; animation: blink 1s step-end infinite; }

    /* Data Link Buttons */
    .links-grid { display: grid; gap: 14px; }

    .data-link {
      display: flex; align-items: center; justify-content: space-between;
      text-decoration: none; padding: 16px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main); font-size: 16px; font-weight: 600;
      letter-spacing: 1px; position: relative; overflow: hidden;
      transition: all 0.2s ease;
      /* Hexagon cut left edge */
      clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    }

    .data-link::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      background: var(--cyan-hud); transition: width 0.2s ease; z-index: -1;
    }

    .data-link:hover {
      border-color: var(--cyan-hud);
      background: rgba(0, 240, 255, 0.05);
      transform: translateX(5px);
      color: #fff; text-shadow: 0 0 8px var(--cyan-hud);
    }

    .data-link:hover::before { width: 100%; opacity: 0.1; }

    .link-left { display: flex; align-items: center; gap: 12px; }
    .link-icon { font-size: 18px; font-family: 'Fira Code', monospace; color: var(--gold-trace); }
    .link-arrow { font-family: 'Fira Code', monospace; color: var(--text-dim); transition: 0.2s; }
    .data-link:hover .link-arrow { color: var(--gold-trace); transform: translateX(5px); }

    .footer {
      margin-top: 30px; text-align: center;
      font-family: 'Fira Code', monospace; font-size: 11px;
      color: #475569; letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .hardware-panel { padding: 35px 20px 25px; }
      h1 { font-size: 22px; }
      .avatar-core { width: 70px; height: 70px; }
      .avatar-text { font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- Background Space/Telemetry Canvas -->
  <canvas id="space-canvas"></canvas>

  <div class="card-wrapper" id="tilt-node">
    <main class="hardware-panel" aria-label="Prashun Pandey Core System">
      
      <!-- System LED -->
      <div class="status-led">
        <div class="led-dot"></div> SYS.ONLINE
      </div>

      <!-- Core Processor Avatar -->
      <div class="avatar-core" aria-hidden="true">
        <span class="avatar-text">PP</span>
      </div>

      <!-- Identity -->
      <h1>Prashun Pandey</h1>
      <p class="tagline">
        Building the bridge between <span>Digital</span> & <span>Physical</span>.<br>
        Maker / Robotics / Space Tech.
      </p>

      <!-- Boot Sequence Telemetry -->
      <div class="telemetry-box">
        <div class="typing-text" id="typewriter"></div>
        <span class="cursor"></span>
      </div>

      <!-- Data Links -->
      <nav class="links-grid" aria-label="Module Links">
        <a class="data-link" href="https://www.linkedin.com/in/prashun-pandey-a265a1348/" target="_blank" rel="noopener noreferrer">
          <div class="link-left"><span class="link-icon">[IN]</span> LinkedIn.Module</div>
          <span class="link-arrow">-></span>
        </a>

        <a class="data-link" href="https://wa.me/919521611788?text=Hi%20Prashun%2C%20I%20saw%20your%20profile%20and%20wanted%20to%20connect." target="_blank" rel="noopener noreferrer">
          <div class="link-left"><span class="link-icon">[WA]</span> Comms.Channel</div>
          <span class="link-arrow">-></span>
        </a>

        <a class="data-link" href="https://github.com/roboPanda69/cnc-portrait" target="_blank" rel="noopener noreferrer">
          <div class="link-left"><span class="link-icon">[GH]</span> CNC_Writer.Repo</div>
          <span class="link-arrow">-></span>
        </a>
      </nav>

      <p class="footer">ENCRYPTED CONNECTION ESTABLISHED</p>
    </main>
  </div>

  <script>
    // --- 1. Terminal Boot Typing Effect ---
    const terminalText = [
      "> BOOT_SEQUENCE INITIATED...",
      "> CALIBRATING CNC WRITER MACHINE...",
      "> STATUS: CONVERTING PIXELS TO INK.",
      "> AWAITING COMMAND..."
    ];
    let lineIndex = 0;
    let charIndex = 0;
    const typeSpeed = 40;
    const lineDelay = 500;
    const terminalElement = document.getElementById('typewriter');

    function typeWriter() {
      if (lineIndex < terminalText.length) {
        if (charIndex < terminalText[lineIndex].length) {
          terminalElement.innerHTML += terminalText[lineIndex].charAt(charIndex);
          charIndex++;
          setTimeout(typeWriter, typeSpeed);
        } else {
          terminalElement.innerHTML += "<br>";
          lineIndex++;
          charIndex = 0;
          setTimeout(typeWriter, lineDelay);
        }
      }
    }
    // Start typing effect 500ms after load
    setTimeout(typeWriter, 500);

    // --- 2. Hardware 3D Hover Tilt ---
    const tiltNode = document.getElementById('tilt-node');
    if (window.innerWidth > 768) {
      document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 30;
        const y = (window.innerHeight / 2 - e.pageY) / 30;
        tiltNode.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
      });
      document.addEventListener('mouseleave', () => {
        tiltNode.style.transform = `rotateY(0deg) rotateX(0deg)`;
        tiltNode.style.transition = 'transform 0.4s ease-out';
      });
      document.addEventListener('mouseenter', () => {
        tiltNode.style.transition = 'none';
      });
    }

    // --- 3. Constellation / Telemetry Canvas ---
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, nodes;

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      nodes = [];
      const nodeCount = width < 768 ? 30 : 60;

      for (let i = 0; i < nodeCount; i++) {
        nodes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          radius: Math.random() * 1.5 + 0.5
        });
      }
    }

    function drawTelemetry() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#eab308'; // Gold nodes

      nodes.forEach((node, i) => {
        node.x += node.vx; node.y += node.vy;
        if (node.x < 0 || node.x > width) node.vx *= -1;
        if (node.y < 0 || node.y > height) node.vy *= -1;

        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < nodes.length; j++) {
          let node2 = nodes[j];
          let dist = Math.hypot(node.x - node2.x, node.y - node2.y);
          if (dist < 100) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 - dist/666})`; // Cyan links
            ctx.moveTo(node.x, node.y);
            ctx.lineTo(node2.x, node2.y);
            ctx.stroke();
          }
        }
      });
      requestAnimationFrame(drawTelemetry);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawTelemetry();
  </script>
</body>
</html>
